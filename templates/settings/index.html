<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>车机设置</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-dark">
  <main id="app-shell">
    <section id="vehicle-screen" class="vehicle-screen" aria-label="车机设置界面">
      <header class="status-bar">
        <div class="status-left"><i data-lucide="car"></i><span>车辆已连接</span></div>
        <div class="status-right"><i data-lucide="bluetooth"></i><i data-lucide="signal"></i><time id="status-time"></time></div>
      </header>

      <div class="screen-heading">
        <h1 id="screen-title">设置</h1>
        <nav id="sub-tabs" class="sub-tabs" aria-label="设置子页面"></nav>
      </div>

      <nav id="category-nav" class="category-nav" aria-label="设置分类"></nav>

      <section id="settings-scroll" class="settings-scroll" aria-live="polite">
        <div id="settings-content" class="settings-content"></div>
      </section>

      <aside id="visual-stage" class="visual-stage" aria-label="车辆控制预览">
        <div id="seat-visual" class="seat-visual">
          <img id="seat-image" alt="座舱座椅预览">
          <div id="seat-drag-pad" class="seat-drag-pad" role="slider" tabindex="0" aria-label="拖动调节座椅位置" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
            <span class="seat-drag-knob"></span>
          </div>
        </div>
        <div id="vehicle-schematic" class="vehicle-schematic" hidden>
          <div class="vehicle-outline"><span></span><span></span><span></span><span></span></div>
        </div>
      </aside>

      <nav class="dock" aria-label="常用功能">
        <button type="button" class="dock-button is-active" data-dock="home" aria-label="主页" title="主页"><i data-lucide="house"></i></button>
        <button type="button" class="dock-button" data-dock="seat" aria-label="座椅" title="座椅"><i data-lucide="armchair"></i></button>
        <div class="climate-control" aria-label="主驾温度"><button type="button" data-climate="driver-down" aria-label="降低主驾温度"><i data-lucide="minus"></i></button><strong id="driver-temp">20.5</strong><button type="button" data-climate="driver-up" aria-label="提高主驾温度"><i data-lucide="plus"></i></button></div>
        <div class="dock-apps">
          <button type="button" class="dock-button" data-dock="vehicle" aria-label="车辆" title="车辆"><i data-lucide="steering-wheel"></i></button>
          <button type="button" class="dock-button" data-dock="settings" aria-label="设置" title="设置"><i data-lucide="settings-2"></i></button>
          <button type="button" class="dock-button" data-dock="media" aria-label="媒体" title="媒体"><i data-lucide="disc-3"></i></button>
          <button type="button" class="dock-button" data-dock="phone" aria-label="电话" title="电话"><i data-lucide="phone"></i></button>
        </div>
        <div class="climate-control" aria-label="副驾温度"><button type="button" data-climate="passenger-down" aria-label="降低副驾温度"><i data-lucide="minus"></i></button><strong id="passenger-temp">20.5</strong><button type="button" data-climate="passenger-up" aria-label="提高副驾温度"><i data-lucide="plus"></i></button></div>
        <button type="button" class="dock-button" data-dock="defrost" aria-label="前挡除霜" title="前挡除霜"><i data-lucide="wind"></i></button>
        <button type="button" class="dock-button" data-dock="volume" aria-label="音量" title="音量"><i data-lucide="volume-2"></i></button>
      </nav>

      <div id="modal-layer" class="modal-layer" hidden>
        <button type="button" class="modal-mask" aria-label="关闭弹窗"></button>
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <h2 id="modal-title"></h2>
          <p id="modal-copy"></p>
          <div id="modal-actions" class="modal-actions"></div>
        </section>
      </div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="lucide.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
